<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxtral Voice Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="title-group">
                <h1>Voxtral Voice Assistant</h1>
                <p class="subtitle">Ask a question out loud, get a spoken answer</p>
            </div>
            <span id="state-badge" class="state-badge state-idle">Idle</span>
        </header>

        <div class="toolbar">
            <label class="toolbar-field">
                <span>Persona</span>
                <select id="preset-select"></select>
            </label>

            <label class="toolbar-field">
                <span>Voice</span>
                <select id="voice-select"></select>
            </label>

            <button id="clone-btn" class="btn btn-secondary" type="button">Clone voice…</button>
            <input id="clone-file" type="file" accept="audio/*" hidden>

            <button id="clear-btn" class="btn btn-secondary" type="button">Clear chat</button>
        </div>

        <main id="conversation" class="conversation" aria-live="polite">
            <div id="empty-state" class="message-empty">Your conversation will appear here.</div>
        </main>

        <p id="status-hint" class="status-hint">Hold the mic button or press and hold Space to ask a question.</p>

        <section class="control-panel">
            <div class="transcript-row">
                <textarea
                    id="transcript-input"
                    class="transcript-input"
                    rows="2"
                    placeholder="Your recognized question will appear here for review — or just type it."
                ></textarea>
                <button id="send-btn" class="btn btn-primary" type="button">Send</button>
            </div>

            <div class="actions-row">
                <button id="talk-btn" class="talk-btn" type="button" aria-pressed="false">
                    <span class="talk-icon" aria-hidden="true">🎤</span>
                    <span class="talk-label">Hold to Talk</span>
                </button>
                <button id="stop-btn" class="btn btn-danger" type="button" hidden>Stop speaking</button>
            </div>
        </section>

        <details class="debug-drawer" id="debug-drawer">
            <summary>Technical details</summary>
            <div class="debug-content">
                <div class="debug-row">
                    <strong>Last transcript:</strong>
                    <span id="debug-transcript">—</span>
                </div>
                <div class="debug-row latency-row">
                    <span class="latency-item">ASR <strong id="latency-asr">—</strong></span>
                    <span class="latency-item">LLM <strong id="latency-llm">—</strong></span>
                    <span class="latency-item">TTS <strong id="latency-tts">—</strong></span>
                </div>
                <div class="debug-log" id="debug-log"></div>
            </div>
        </details>
    </div>

    <script src="/static/app.js" type="module"></script>
</body>
</html>
